name: Cane Line Final Artifact
on:
  push:
    paths:
      - ".github/workflows/cane-line-voice-transfer.yml"
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download corrected video master
        run: |
          curl -L --fail -o master.mp4 "https://cdn.creativeclaw.co/u/c129bbd3/videos/1dc0eea8-a105-47fb-80dc-3021472e0776.mp4"
      - name: Download deep narrator
        run: |
          curl -L --fail -o voice.mp3 "https://cdn.creativeclaw.co/u/c129bbd3/audio/0d9c6d79-8a32-4568-acf1-c47865c5f552.mp3"
      - name: Merge voice onto video
        run: |
          ffmpeg -y -i master.mp4 -i voice.mp3 -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 160k Cane_Line_Road_Final_Voiced.mp4
      - name: Upload final reel
        uses: actions/upload-artifact@v4
        with:
          name: Cane-Line-Road-Final-Voiced
          path: Cane_Line_Road_Final_Voiced.mp4
          if-no-files-found: error
          retention-days: 1
